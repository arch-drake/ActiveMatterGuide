name: Map fidelity validation
on:
  push:
    paths:
      - 'tools/map_reconciliation.html'
      - 'tools/map_fidelity_dashboard.html'
      - 'map-evidence/**'
      - 'tests/map_*.test.cjs'
      - '.github/workflows/map-fidelity-ci.yml'
  pull_request:
    paths:
      - 'tools/map_reconciliation.html'
      - 'tools/map_fidelity_dashboard.html'
      - 'map-evidence/**'
      - 'tests/map_*.test.cjs'
      - '.github/workflows/map-fidelity-ci.yml'
permissions:
  contents: read
jobs:
  map-evidence-regression:
    name: Deterministic evidence and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original alignment geometry tests
        run: node tests/map_reconciliation_checks.test.cjs
      - name: Validate 14-map source register, landmark fit/holdout, import and review safety
        run: node tests/map_fidelity_workflow.test.cjs
      - name: Assert that the release status remains source-truthful
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('map-evidence/map_fidelity_register.v1.json')); if(x.maps.length!==14||x.maps.some(m=>m.geometryVerified||m.basemapStatus!=='illustration'))process.exit(1);console.log('Source register remains honest: 14 unverified maps')"
# IMPORTANT: CI only validates source syntax/data/geometry. It cannot verify
# real game geography, copied-map redistribution rights or Windows file:// behavior.
